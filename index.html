<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparring Coach — play what humans actually play</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap">

<header>
  <h1>Sparring <em>Coach</em></h1>
  <div class="tag">plays what humans actually play</div>
</header>

<div class="cols" id="cols">
  <div class="boardcol">
    <div class="stack">
      <div class="boardwrap">
        <div class="board" id="board"></div>
        <div class="promo" id="promo"></div>
      </div>

      <div class="evalbar" id="evalbar" title="Engine evaluation, from White's point of view">
        <i class="w" id="evalw"></i>
        <i class="b" id="evalb"></i>
        <span class="val" id="evaltxt">0.0</span>
      </div>

      <div class="ribbon" id="ribbon">
        <div class="eco" id="eco">Opening</div>
        <div class="name" id="oname">Starting position</div>
        <div class="sub" id="osub">Make a move to begin.</div>
      </div>

      <div class="ctl">
        <select id="level" title="Opponent strength"></select>
        <select id="side" title="Your colour">
          <option value="w">You play White</option>
          <option value="b">You play Black</option>
        </select>
        <button type="button" id="newg">New game</button>
        <button type="button" id="undo">Take back</button>
        <button type="button" id="flip">Flip</button>
        <button type="button" id="coach" class="on" title="C — when off, you move both sides">Coach: On</button>
        <button type="button" id="peek" title="Collapse the whole right-hand panel">Hide panel</button>
        <button type="button" id="pgn">Copy PGN</button>
        <button type="button" id="retry">Retry database</button>
        <button type="button" id="tok">Lichess token</button>
        <span class="hint" title="Arrow keys step through the game, Home and End jump to either end, C toggles the coach">← → review · C coach</span>
      </div>

      <div class="pools">
        <span class="plabel" title="Which Lichess rating pools the database is read from">Pools</span>
        <span class="chips" id="chips"></span>
        <button type="button" class="mini" id="widen" title="Add the neighbouring rating pools — more games, looser play">Widen</button>
        <button type="button" class="mini" id="poolreset" title="Back to this level's default pools">Reset</button>
      </div>

      <div class="note" id="note"></div>
    </div>
  </div>

  <div class="sidepanel" id="sidepanel">
    <div class="card">
      <h2>
        <span class="ttl">Human choices here</span>
        <span class="h2r">
          <span class="amt" id="poptot"></span>
          <button type="button" class="toggle" id="candtoggle" aria-controls="cands" aria-expanded="true">Hide</button>
        </span>
      </h2>
      <div id="cands" class="note">Waiting for the position…</div>
      <div class="legend" id="legend" hidden>
        <span><i class="sw-w"></i>White wins</span>
        <span><i class="sw-d"></i>Draw</span>
        <span><i class="sw-b"></i>Black wins</span>
      </div>
    </div>

    <div class="card">
      <h2><span class="ttl">Game</span><span class="amt" id="depth"></span></h2>
      <div class="moves" id="moves"><span class="ob">No moves yet.</span></div>
    </div>

    <div class="card">
      <h2><span class="ttl">How this opponent thinks</span></h2>
      <div class="note" id="expl"></div>
      <div class="warn" id="offline" hidden></div>
    </div>
  </div>
</div>
</div>
</body>
</html>
